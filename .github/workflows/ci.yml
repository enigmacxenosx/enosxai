name: CI — pnpm Workspace Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck enosx-app
        run: pnpm --filter @workspace/enosx-app typecheck || pnpm --filter @enosx/app typecheck || pnpm -r typecheck

      - name: Typecheck exlover
        run: pnpm --filter @enosx/exlover typecheck || true

      - name: Build exlover
        run: pnpm --filter @enosx/exlover build || true

  desktop:
    name: Check desktop shell and local-model bridge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/enosx-app build

      - name: Check Tauri desktop shell
        run: cargo check --manifest-path desktop-shell/src-tauri/Cargo.toml
