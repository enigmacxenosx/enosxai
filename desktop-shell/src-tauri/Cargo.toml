[package]
name = "enosx-ai-desktop"
version = "0.1.0"
description = "ENOSX AI desktop shell"
authors = ["Enosx Technologies"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
